{% extends "base.html" %}
{% block title %}Edit department{% endblock %}
{% block page_title %}Edit department{% endblock %}

{% block content %}
<div class="gl-page-head">
  <div>
    <span class="gl-page-head__eyebrow">Setup · Departments</span>
    <h2 class="gl-mt-0">Edit {{ department.name }}</h2>
  </div>
  <a href="{% url 'academics:department_list' %}" class="gl-btn gl-btn--ghost">Back to departments</a>
</div>

<div class="gl-card" style="max-width: 420px;">
  <form method="post">
    {% csrf_token %}
    <div class="gl-form-row"><label>Name</label>{{ form.name }}</div>
    <div class="gl-form-row"><label>Code</label>{{ form.code }}</div>
    <div class="gl-form-actions">
      <button type="submit" class="gl-btn gl-btn--accent">Save changes</button>
      <a href="{% url 'academics:department_list' %}" class="gl-btn gl-btn--ghost">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
